<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Sales P2P</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0b0f19; --card: #151c2c; --accent: #22c55e; --text: #f8fafc; --muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 70px; }

        /* Экран загрузки CS 1.6 */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .cs-logo { font-size: 28px; font-weight: bold; color: #ffcc00; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,204,0,0.5); }
        .progress-bar-container { width: 250px; height: 16px; border: 2px solid #ffcc00; padding: 2px; background: #111; }
        .progress-bar { width: 0%; height: 100%; background: #ffcc00; transition: width 0.2s; }
        .loading-text { margin-top: 10px; font-size: 14px; color: var(--muted); }

        /* Навигация */
        .navbar { display: flex; justify-content: space-around; background: var(--card); position: fixed; bottom: 0; left: 0; width: 100%; padding: 12px 0; border-top: 1px solid #1e293b; z-index: 100; }
        .nav-item { color: var(--muted); text-align: center; font-size: 12px; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { display: block; font-size: 18px; margin-bottom: 4px; }

        /* Шапка */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--card); border-bottom: 1px solid #1e293b; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #333; }
        .balance-box { background: #1e293b; padding: 6px 12px; border-radius: 8px; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 5px; }

        /* Контент */
        .container { padding: 15px; display: none; }
        .container.active { display: block; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: var(--accent); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 5px; }
        button:active { opacity: 0.8; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .card { background: var(--card); border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #1e293b; }
        .card img { width: 100px; height: 100px; object-fit: contain; }
        .card-title { font-size: 13px; margin: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-price { color: var(--accent); font-weight: bold; margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loader">
        <div class="cs-logo">LOADING STEAM SALES...</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="loading-text" id="loadingText">Инициализация ресурсов...</div>
    </div>

    <!-- Шапка профиля -->
    <div class="header">
        <div class="user-info">
            <img id="userAvatar" class="user-avatar" src="" alt="">
            <div>
                <div id="userName" style="font-weight: bold; font-size: 14px;">Игрок</div>
                <div style="font-size: 11px; color: var(--muted);">⭐ Рейтинг: <span id="userRating">5.0</span></div>
            </div>
        </div>
        <div class="balance-box">
            <span id="userBalance">0</span> ₽
            <button onclick="switchTab('wallet')" style="width: auto; padding: 4px 8px; font-size: 12px; margin: 0;">+</button>
        </div>
    </div>

    <!-- Вкладка 1: Маркетплейс -->
    <div id="tab-market" class="container active">
        <input type="text" id="searchInput" placeholder="🔍 Поиск предмета..." oninput="filterMarket()">
        <div class="grid" id="marketGrid">
            <!-- Сюда динамически падают товары -->
        </div>
    </div>

    <!-- Вкладка 2: Инвентарь -->
    <div id="tab-inventory" class="container">
        <h3 style="margin-bottom: 10px;">Твой STEAM инвентарь</h3>
        <input type="text" id="tradeUrlInput" placeholder="Вставьте вашу Trade URL...">
        <button onclick="saveAndLoadInventory()">Загрузить инвентарь</button>
        <div class="grid" id="inventoryGrid" style="margin-top: 15px;"></div>
    </div>

    <!-- Вкладка 3: Розыгрыши -->
    <div id="tab-giveaways" class="container">
        <h3>Активные розыгрыши</h3>
        <div id="giveawaysList" style="margin-top: 10px;"></div>
    </div>

    <!-- Вкладка 4: Кошелек / Пополнение -->
    <div id="tab-wallet" class="container">
        <h3>Пополнение баланса</h3>
        
        <label>Сумма пополнения:</label>
        <input type="number" id="topupAmount" placeholder="Введите сумму">

        <button onclick="payCrypto()" style="background: #2481cc; color: #fff; margin-top: 10px;">💳 Пополнить через CryptoBot (от 3 USDT)</button>
        <button onclick="payStars()" style="background: #e1ab3f; color: #000; margin-top: 10px;">⭐ Пополнить через Telegram Stars</button>
        
        <hr style="border-color: #1e293b; margin: 20px 0;">
        
        <h3>P2P Пополнение (Карты Узбекистана)</h3>
        <button onclick="payP2P()" style="background: #3b82f6; color: #fff;"> Uzbek Card (Humo / UzCard)</button>
        
        <hr style="border-color: #1e293b; margin: 20px 0;">
        
        <h3>Вывод средств</h3>
        <input type="number" id="withdrawAmount" placeholder="Сумма вывода">
        <input type="text" id="withdrawDetails" placeholder="Номер карты или реквизиты">
        <button onclick="requestWithdraw()" style="background: #ef4444; color: #fff;">Запросить вывод</button>
    </div>

    <!-- Нижнее меню -->
    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('market')"><i>🛒</i>Маркет</div>
        <div class="nav-item" onclick="switchTab('inventory')"><i>🎒</i>Инвентарь</div>
        <div class="nav-item" onclick="switchTab('giveaways')"><i>🎁</i>Розыгрыши</div>
        <div class="nav-item" onclick="switchTab('wallet')"><i>💳</i>Кошелек</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe.user || { id: 12345, first_name: 'Гость', username: 'guest' };

        // Инициализация профиля ТГ
        document.getElementById('userName').innerText = user.first_name;
        if (user.photo_url) document.getElementById('userAvatar').src = user.photo_url;

        // Имитация классической загрузки CS 1.6
        let progress = 0;
        const progressBar = document.getElementById('progressBar');
        const loadingText = document.getElementById('loadingText');
        const loader = document.getElementById('loader');

        const loadingStages = [
            "Загрузка моделей игрока...",
            "Кэширование звуков окружения...",
            "Подключение к серверу P2P...",
            "Загрузка каталога скинов...",
            "Готово!"
        ];

        let loadInterval = setInterval(() => {
            progress += Math.floor(Math.random() * 15) + 5;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadInterval);
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
            progressBar.style.width = progress + '%';
            let stageIndex = Math.floor((progress / 100) * (loadingStages.length - 1));
            loadingText.innerText = loadingStages[stageIndex];
        }, 150);

        // Переключение вкладок
        function switchTab(tabId) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Загрузка инвентаря по трейд-ссылке
        async function saveAndLoadInventory() {
            const tradeUrl = document.getElementById('tradeUrlInput').value;
            if (!tradeUrl) return alert('Введите trade URL!');
            
            const res = await fetch('/api/steam/inventory', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tradeUrl })
            });
            const data = await res.json();
            
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = '';
            
            if (data.success && data.items.length > 0) {
                data.items.forEach(item => {
                    const desc = data.descriptions.find(d => d.classid === item.classid && d.instanceid === item.instanceid);
                    if (!desc) return;
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="https://community.cloudflare.steamstatic.com/economy/image/${desc.icon_url}" alt="">
                        <div class="card-title">${desc.market_hash_name}</div>
                        <button onclick="sellItem('${desc.market_hash_name}', '${desc.icon_url}', '${tradeUrl}')">Продать</button>
                    `;
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: var(--muted);">Инвентарь пуст или профиль скрыт</p>';
            }
        }

        // Выставить товар на продажу
        async function sellItem(name, iconUrl, tradeUrl) {
            // Запрос цены из API (можно применить промокод)
            const priceRes = await fetch(`/api/steam/price?name=${encodeURIComponent(name)}`);
            const priceData = await priceRes.json();
            
            let price = priceData.price || 150;
            
            const res = await fetch('/api/market/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, iconUrl, price, tgId: user.id, tradeUrl })
            });
            const data = await res.json();
            if (data.success) {
                alert('Предмет успешно выставлен на маркетплейс!');
                loadMarketItems();
            }
        }

        // Загрузка товаров маркета
        async function loadMarketItems() {
            const res = await fetch('/api/market/items');
            const data = await res.json();
            const grid = document.getElementById('marketGrid');
            grid.innerHTML = '';
            
            if (data.success && data.items.length > 0) {
                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="https://community.cloudflare.steamstatic.com/economy/image/${item.iconUrl}" alt="">
                        <div class="card-title">${item.name}</div>
                        <div class="card-price">${item.price} ₽</div>
                        <button onclick="buyItem('${item._id}')">Купить</button>
                    `;
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: var(--muted);">Нет товаров на продаже</p>';
            }
        }

        // Покупка товара
        async function buyItem(itemId) {
            const buyerTradeUrl = prompt('Введите вашу Trade URL для получения предмета:');
            if (!buyerTradeUrl) return;

            const res = await fetch('/api/deals/buy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ buyerTgId: user.id, buyerTradeUrl, itemId })
            });
            const data = await res.json();
            if (data.success) {
                alert('Запрос на покупку создан! Продавец уведомлен.');
                loadMarketItems();
            } else {
                alert(data.error || 'Ошибка покупки');
            }
        }

        // Пополнение CryptoBot
        async function payCrypto() {
            const amount = document.getElementById('topupAmount').value;
            const res = await fetch('/api/billing/invoice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tgId: user.id, method: 'crypto', amount })
            });
            const data = await res.json();
            if (data.success) window.location.href = data.url;
            else alert(data.error);
        }

        // Пополнение Telegram Stars
        async function payStars() {
            const amount = document.getElementById('topupAmount').value;
            const res = await fetch('/api/billing/invoice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tgId: user.id, method: 'stars', amount })
            });
            const data = await res.json();
            if (data.success) tg.openInvoice(data.url);
            else alert(data.error);
        }

        // Пополнение P2P (Узбекистан)
        async function payP2P() {
            const amount = document.getElementById('topupAmount').value;
            if (!amount) return alert('Введите сумму');
            const res = await fetch('/api/billing/p2p', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tgId: user.id, username: user.username, amount })
            });
            const data = await res.json();
            alert(data.message);
        }

        // Запрос на вывод
        async function requestWithdraw() {
            const amount = document.getElementById('withdrawAmount').value;
            const details = document.getElementById('withdrawDetails').value;
            if (!amount || !details) return alert('Заполните все поля');
            
            const res = await fetch('/api/billing/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tgId: user.id, amount, details })
            });
            const data = await res.json();
            alert(data.message);
        }

        // Фильтрация маркета
        function filterMarket() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#marketGrid .card').forEach(card => {
                let title = card.querySelector('.card-title').innerText.toLowerCase();
                card.style.display = title.includes(query) ? 'block' : 'none';
            });
        }

        // Загрузка маркета при старте
        loadMarketItems();
    </script>
</body>
</html>
